version: "2"
type: backend
tech_stack:
  - Node.js
  - Express.js v5
  - PostgreSQL
  - Prisma ORM
  - JWT (jsonwebtoken)
  - bcrypt
  - express-validator
  - multer
  - csv-parse
  - dotenv
features:
  - name: Health Check API
    description: Basic health check endpoint to verify the API server is running
    files:
      - backend/src/index.js
    endpoints:
      - method: GET
        path: /api/health
        description: Returns server status and timestamp
        auth_required: false
        response_schema:
          "200":
            status: string
            message: string
            timestamp: string
    depends_on: []

  - name: Authentication API
    description: JWT-based login and session management
    files:
      - backend/src/routes/auth.js
      - backend/src/middleware/auth.js
    endpoints:
      - method: POST
        path: /api/auth/login
        description: Authenticate with username and password, returns JWT token and user object
        auth_required: false
        request_schema:
          body:
            username: string
            password: string
        response_schema:
          "200":
            token: string
            user:
              id: number
              username: string
              fullName: string
              role: string
          "400": Validation error array
          "401": Invalid credentials
      - method: GET
        path: /api/auth/me
        description: Returns the currently authenticated user based on the JWT token
        auth_required: true
        response_schema:
          "200":
            user:
              id: number
              username: string
              fullName: string
              role: string
          "401": No token or invalid token
      - method: POST
        path: /api/auth/logout
        description: Acknowledges logout — token removal is handled client-side
        auth_required: true
        response_schema:
          "200":
            message: string
          "401": No token or invalid token
    depends_on: []

  - name: User Management API
    description: Admin-only CRUD operations for managing user accounts
    files:
      - backend/src/routes/users.js
      - backend/src/middleware/auth.js
    endpoints:
      - method: GET
        path: /api/users
        description: List all users, no password hash returned
        auth_required: true
        response_schema:
          "200":
            users: "User[]"
          "401": Unauthorized
          "403": Admin access required
      - method: POST
        path: /api/users
        description: "Create a new user account. IMPORTANT: response body is always wrapped in a 'user' key — { \"user\": { id, username, fullName, role, isActive } }. To get the user id, always do resp.json()[\"user\"][\"id\"], NOT resp.json()[\"id\"]."
        auth_required: true
        request_schema:
          body:
            username: string
            password: string
            fullName: string
            role: "admin | user"
        response_schema:
          "201":
            user:
              id: number
              username: string
              fullName: string
              role: string
              isActive: boolean
        example_response_201: '{"user": {"id": 5, "username": "alice", "fullName": "Alice Smith", "role": "user", "isActive": true}}'
        notes: "Always unwrap the 'user' key from response: data = resp.json(); user_id = data['user']['id']"
        error_responses:
          "400": Validation error
          "401": Unauthorized
          "403": Admin access required
          "409": Username already taken
      - method: PUT
        path: /api/users/:id
        description: "Update a user's fullName, role, or password. IMPORTANT: response body is always wrapped in a 'user' key — { \"user\": { id, username, fullName, role } }. Always do resp.json()[\"user\"] to get the user object."
        auth_required: true
        request_schema:
          body:
            fullName: "string (optional)"
            role: "admin | user (optional)"
            password: "string (optional)"
        response_schema:
          "200":
            user:
              id: number
              username: string
              fullName: string
              role: string
        example_response_200: '{"user": {"id": 5, "username": "alice", "fullName": "Alice Updated", "role": "admin"}}'
        notes: "Always unwrap the 'user' key from response: data = resp.json(); updated_user = data['user']"
        error_responses:
          "400": Validation error or no fields to update
          "401": Unauthorized
          "403": Admin access required
          "404": User not found
      - method: PATCH
        path: /api/users/:id/status
        description: "Activate or deactivate a user account. Cannot deactivate own account (returns 400). IMPORTANT: response body is always wrapped in a 'user' key — { \"user\": { id, isActive, ... } }. Always do resp.json()[\"user\"] to get the user object."
        auth_required: true
        request_schema:
          body:
            isActive: boolean
        response_schema:
          "200":
            user:
              id: number
              isActive: boolean
        example_response_200: '{"user": {"id": 5, "username": "alice", "fullName": "Alice Smith", "role": "user", "isActive": false}}'
        notes: "Always unwrap the 'user' key: data = resp.json(); assert data['user']['isActive'] == False"
        error_responses:
          "400": Cannot deactivate own account
          "401": Unauthorized
          "403": Admin access required
          "404": User not found
    depends_on:
      - Authentication API

  - name: Vendor Management API
    description: List vendors and bulk CSV import (admin only for imports)
    files:
      - backend/src/routes/vendors.js
    endpoints:
      - method: GET
        path: /api/vendors
        description: List all active vendors
        auth_required: true
        response_schema:
          "200":
            vendors: "Vendor[]"
          "401": Unauthorized
      - method: POST
        path: /api/vendors/import/preview
        description: Parse uploaded CSV file and return rows with validation errors. No DB writes. Multipart/form-data with field named 'file'.
        auth_required: true
        request_schema:
          body:
            file: "CSV file (multipart/form-data, field name: file)"
        response_schema:
          "200":
            rows: "array of parsed row objects (normalized headers)"
            errors: "array of {rowNumber, field, message}"
          "400": No file or parse error
          "401": Unauthorized
          "403": Admin access required
      - method: POST
        path: /api/vendors/import
        description: Commit validated vendor rows to database. JSON body. skipDuplicates by vendorCode.
        auth_required: true
        request_schema:
          body:
            rows: "array of vendor row objects with vendor_code, vendor_name, etc."
        response_schema:
          "201":
            inserted: number
          "400": Validation error
          "401": Unauthorized
          "403": Admin access required
    depends_on:
      - Authentication API

  - name: Item Management API
    description: List items and bulk CSV import (admin only for imports)
    files:
      - backend/src/routes/items.js
    endpoints:
      - method: GET
        path: /api/items
        description: List all active items
        auth_required: true
        response_schema:
          "200":
            items: "Item[]"
          "401": Unauthorized
      - method: POST
        path: /api/items/import/preview
        description: Parse uploaded items CSV file and return rows with validation errors. No DB writes. Multipart/form-data with field named 'file'.
        auth_required: true
        request_schema:
          body:
            file: "CSV file (multipart/form-data, field name: file)"
        response_schema:
          "200":
            rows: "array of parsed row objects"
            errors: "array of {rowNumber, field, message}"
          "400": No file or parse error
          "401": Unauthorized
          "403": Admin access required
      - method: POST
        path: /api/items/import
        description: Commit validated item rows to database. JSON body. skipDuplicates by itemCode.
        auth_required: true
        request_schema:
          body:
            rows: "array of item row objects with item_code, description, etc."
        response_schema:
          "201":
            inserted: number
          "400": Validation error
          "401": Unauthorized
          "403": Admin access required
    depends_on:
      - Authentication API

  - name: Transaction API
    description: Create receipts, view stock position, and query transaction history
    files:
      - backend/src/routes/transactions.js
    endpoints:
      - method: POST
        path: /api/transactions/receipts
        description: Create a RECEIPT transaction. Returns created transaction and lastPaidPrice for the item.
        auth_required: true
        request_schema:
          body:
            itemId: "integer"
            vendorId: "integer"
            location: "ADEL | CALHOUN"
            quantity: "number (positive float)"
            unitCost: "number (positive float)"
            transactionDate: "ISO 8601 date string e.g. 2026-02-17"
            invoiceNumber: "string (optional)"
            notes: "string (optional)"
        response_schema:
          "201":
            transaction: Transaction
            lastPaidPrice: "number | null"
          "400": Validation error
          "401": Unauthorized
          "404": Item or Vendor not found
      - method: GET
        path: /api/transactions/stock-position
        description: Current qty on hand per item per location, calculated from SUM of all transaction quantities grouped by itemId and location
        auth_required: true
        response_schema:
          "200":
            positions: "array of {item: {id, itemCode, description, category, unitOfMeasure, minQuantity}, adelQty, calhounQty, totalQty}"
          "401": Unauthorized
      - method: GET
        path: /api/transactions
        description: Transaction history. Supports optional query params: itemId (int), location (ADEL|CALHOUN), type (RECEIPT|ADJUSTMENT|TRANSFER|OPENING_BALANCE), from (date), to (date).
        auth_required: true
        response_schema:
          "200":
            transactions: "Transaction[] with item, vendor, user included"
          "400": Validation error on filter params
          "401": Unauthorized
    depends_on:
      - Authentication API
      - Vendor Management API
      - Item Management API

  - name: Dashboard API
    description: Aggregated metrics and alerts for the operations dashboard
    files:
      - backend/src/routes/dashboard.js
    endpoints:
      - method: GET
        path: /api/dashboard/stats
        description: Live counts for stat cards
        auth_required: true
        response_schema:
          "200":
            totalItems: number
            transactionsMTD: number
            activeVendors: number
            teamMembers: number
          "401": Unauthorized
      - method: GET
        path: /api/dashboard/low-stock
        description: Items at or below min_quantity. burnRate is units/day from last 30 days outgoing transactions (null if no outgoing). daysRemaining is currentStock/burnRate (null if no burn rate).
        auth_required: true
        response_schema:
          "200":
            items: "array of {id, itemCode, description, category, unitOfMeasure, currentStock, minQuantity, burnRate, daysRemaining}"
          "401": Unauthorized
      - method: GET
        path: /api/dashboard/dead-stock
        description: Items with stock on hand but zero transaction activity in the last 90 days
        auth_required: true
        response_schema:
          "200":
            items: "array of {id, itemCode, description, category, currentStock}"
          "401": Unauthorized
      - method: GET
        path: /api/dashboard/valuation
        description: On-hand inventory value by location using last known unit cost per item per location
        auth_required: true
        response_schema:
          "200":
            adel: number
            calhoun: number
            total: number
          "401": Unauthorized
      - method: GET
        path: /api/dashboard/activity
        description: Last 20 transactions as human-readable strings, newest first
        auth_required: true
        response_schema:
          "200":
            activity: "array of {id, description, transactionType, location, transactionDate, createdAt}"
          "401": Unauthorized
    depends_on:
      - Authentication API
      - Transaction API

known_limitations:
  - issue: No rate limiting on login endpoint
    location: backend/src/routes/auth.js
    impact: Brute force possible, acceptable for internal tool at this stage
  - issue: No DELETE endpoint for users, vendors, or items
    location: backend/src/routes/users.js
    impact: Soft-delete only via isActive flag; test cleanup falls back to deactivation
  - issue: No token revocation/blacklist
    location: backend/src/routes/auth.js
    impact: JWT remains valid until 7-day expiry after logout; mitigated by isActive check on every request
