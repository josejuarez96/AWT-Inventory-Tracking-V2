version: "2"
type: backend
tech_stack:
  - javascript
  - express5
  - postgresql
  - prisma
features:
  - name: Item Code Uniqueness Check
    description: Case-insensitive check if an item code already exists. Normalizes input to uppercase. Returns exists boolean and item id.
    files:
      - backend/src/routes/items.js
    endpoints:
      - method: GET
        path: /api/items/check-code
        description: Check if item code exists (case-insensitive)
        auth_required: true
        request_schema:
          query:
            code: string
        response_schema:
          "200": "{ exists: boolean, id: number | null }"
          "400": "{ error: 'code query parameter is required' }"
    depends_on:
      - Authentication
  - name: Vendor Next Code Suggestion
    description: Suggest next sequential vendor code based on prefix. Finds max numeric suffix among existing codes with that prefix, increments by 1, pads to 3 digits.
    files:
      - backend/src/routes/vendors.js
    endpoints:
      - method: GET
        path: /api/vendors/next-code
        description: Suggest next sequential vendor code
        auth_required: true
        request_schema:
          query:
            prefix: string
        response_schema:
          "200": "{ nextCode: string }"
          "400": "{ error: 'prefix query parameter is required' }"
    depends_on:
      - Authentication
  - name: Vendor Code Uniqueness Check
    description: Case-insensitive check if a vendor code already exists. Normalizes input to uppercase. Returns exists boolean and vendor id.
    files:
      - backend/src/routes/vendors.js
    endpoints:
      - method: GET
        path: /api/vendors/check-code
        description: Check if vendor code exists (case-insensitive)
        auth_required: true
        request_schema:
          query:
            code: string
        response_schema:
          "200": "{ exists: boolean, id: number | null }"
          "400": "{ error: 'code query parameter is required' }"
    depends_on:
      - Authentication
  - name: Vendor Hard Delete
    description: Permanently delete a vendor with no references. Admin-only. Blocks deletion if vendor is referenced in transactions, is default vendor on any item, or is additional vendor on any item.
    files:
      - backend/src/routes/vendors.js
    endpoints:
      - method: DELETE
        path: /api/vendors/{id}
        description: Hard delete vendor if unreferenced
        auth_required: true
        request_schema:
          params:
            id: integer
        response_schema:
          "200": "{ message: string }"
          "400": "{ error: string } - vendor has references"
          "403": "{ error: 'Admin access required' }"
          "404": "{ error: 'Vendor not found' }"
    depends_on:
      - Authentication
  - name: Item Code Case-Insensitive Create Protection
    description: Item creation normalizes itemCode to uppercase and rejects case-insensitive duplicates with 409 Conflict.
    files:
      - backend/src/routes/items.js
    endpoints:
      - method: POST
        path: /api/items
        description: Create item with uppercase-normalized code and case-insensitive uniqueness check
        auth_required: true
        request_schema:
          body:
            itemCode: string
            description: string
            unitOfMeasure: string
        response_schema:
          "201": "{ item: Item }"
          "409": "{ error: 'Item code \"XYZ\" already exists' }"
    depends_on:
      - Authentication
  - name: Vendor Code Case-Insensitive Create Protection
    description: Vendor creation normalizes vendorCode to uppercase and rejects case-insensitive duplicates with 409 Conflict.
    files:
      - backend/src/routes/vendors.js
    endpoints:
      - method: POST
        path: /api/vendors
        description: Create vendor with uppercase-normalized code and case-insensitive uniqueness check
        auth_required: true
        request_schema:
          body:
            vendorCode: string
            vendorName: string
        response_schema:
          "201": "{ vendor: Vendor }"
          "409": "{ error: 'Vendor code \"XYZ\" already exists' }"
    depends_on:
      - Authentication
known_limitations: []
